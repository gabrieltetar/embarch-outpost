CONFIG_ZTEST=y
CONFIG_EMBARCH_OUTPOST=y
CONFIG_TRACING_USER=y
CONFIG_EMBARCH_OUTPOST_MARKER_HEADER="app_outpost_markers.h"
# The range minimum: 16 slots, so a short burst overflows it, and the build
# itself is the proof that the minimum is accepted.
CONFIG_EMBARCH_OUTPOST_RING_BYTES=320
CONFIG_EMBARCH_OUTPOST_OVERFLOW_BLOCK=y
CONFIG_SERIAL=y

CONFIG_EMBARCH_OUTPOST_TRACE_THREADS=n
CONFIG_EMBARCH_OUTPOST_TRACE_ISRS=n
CONFIG_EMBARCH_OUTPOST_TRACE_IDLE=n
