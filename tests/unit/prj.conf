CONFIG_ZTEST=y
CONFIG_EMBARCH_OUTPOST=y
CONFIG_TRACING_USER=y
CONFIG_EMBARCH_OUTPOST_MARKER_HEADER="app_outpost_markers.h"
CONFIG_EMBARCH_OUTPOST_RING_BYTES=512
CONFIG_SERIAL=y

# The hook families are off: these tests drive the ring and the encoder
# directly, and a live trace filling the ring underneath them would make every
# count non-deterministic.
CONFIG_EMBARCH_OUTPOST_TRACE_THREADS=n
CONFIG_EMBARCH_OUTPOST_TRACE_ISRS=n
CONFIG_EMBARCH_OUTPOST_TRACE_IDLE=n
