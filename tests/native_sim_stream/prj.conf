CONFIG_EMBARCH_OUTPOST=y
# Two symbols, not one: TRACING_USER is a Kconfig *choice* member, and neither
# `select` nor `configdefault` reaches one from a module (both were tried; both
# warn and do nothing). src/outpost.c refuses to compile without it, so the
# pair still cannot be half-enabled.
CONFIG_TRACING_USER=y
CONFIG_EMBARCH_OUTPOST_MARKER_HEADER="app_outpost_markers.h"

# Small ring on purpose: the burst in main() must actually overflow it, so the
# gap record is exercised rather than asserted.
CONFIG_EMBARCH_OUTPOST_RING_BYTES=1024
CONFIG_EMBARCH_OUTPOST_HEADER_INTERVAL_MS=100
CONFIG_EMBARCH_OUTPOST_THREAD_WAIT_MS=2

# native_sim has no serial driver by default -- its console is
# POSIX_ARCH_CONSOLE, which writes to stdout without a UART at all.
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=n

# uart0 bound to the process's own stdout, so `zephyr.exe > outpost.bin`
# captures the stream exactly as a serial capture would. Nothing else may write
# there: POSIX_ARCH_CONSOLE is y-selected by the board and cannot be turned
# off, so printk is what gets silenced instead.
CONFIG_UART_NATIVE_PTY_0_ON_STDINOUT=y
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_LOG=n
